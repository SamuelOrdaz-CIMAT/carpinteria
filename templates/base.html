<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carpinteria</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">Carpinteria</a>
    <nav>
      <a href="{{ url_for('materials') }}">Materiales</a>
      <a href="{{ url_for('suppliers') }}">Proveedores</a>
      <a href="{{ url_for('prices') }}">Precios</a>
      <a href="{{ url_for('furniture') }}">Muebles</a>
      <a href="{{ url_for('budgets') }}">Presupuestos</a>
      <a href="{{ url_for('settings') }}">Configuracion</a>
      {% if session.get("authenticated") %}<a href="{{ url_for('logout') }}">Salir</a>{% endif %}
    </nav>
  </header>
  <main class="page">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
